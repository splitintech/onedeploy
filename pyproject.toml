[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "onedeploy"
version = "0.2.0a1"
description = "Local, plan-first deployment tooling for Railway, Daytona and Modal"
readme = "docs/GETTING_STARTED.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "SplitIn contributors"}]
dependencies = ["PyYAML==6.0.3", "jsonschema==4.25.1"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
]

[project.optional-dependencies]
tui = ["textual==8.2.8"]
daytona = ["daytona==0.226.0"]
modal = ["modal==1.6.2"]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "build==1.3.0"]

[project.scripts]
onedeploy = "onedeploy.cli:main"

[project.urls]
Repository = "https://github.com/splitintech/onedeploy"
Issues = "https://github.com/splitintech/onedeploy/issues"

[tool.setuptools.packages.find]
include = ["onedeploy*"]

[tool.setuptools.package-data]
onedeploy = ["templates/**/*", "templates/**/.env.example"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
